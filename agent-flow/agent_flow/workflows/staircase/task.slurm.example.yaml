mode: onboard

reference_code_path: /shared/transformers/src/transformers/models/<name>/modeling_<name>.py
checkpoint_path: /shared/checkpoints/<ModelName>-<Variant>
trtllm_repo_path: /shared/TensorRT-LLM

target:
  family: deepseek_v3
  checkpoint: r1_0528_nvfp4
  gpu_arch: sm_103
  parallel: dep4

accuracy_anchor:
  benchmark: mmlu
  score: 95.07
  tolerance: 5.0
  source: "tests/integration/defs/accuracy/references/<reference>.yaml @ <commit>"

slurm-environment:
  slurm_account: coreai_comparch_trtllm
  slurm_partition: batch
  slurm_qos: normal
  docker_image: /shared/containers/trtllm-local-dev.sqsh

# These are ceilings for Slurm work coordinated by the single Smith-mode
# Coder. They do not create multiple autonomous Smith agent sessions.
smith:
  max_parallel_jobs: 4
  max_nodes_per_job: 2
  max_total_nodes: 8

completion_criteria:
  - "ModelingV2 required routing selects the exact target without fallback"
  - "The configured accuracy result is within tolerance of the cited anchor"

implements_tips:
  - "Reuse the existing local-dev build after proving its source/native/container identity"
  - "Use one artifact and log namespace per Smith catalog entry and Slurm job"
