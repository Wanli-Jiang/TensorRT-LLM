# Local/development task. Use task.slurm.example.yaml from a Slurm login node.
mode: onboard

reference_code_path: /path/to/transformers/src/transformers/models/<name>/modeling_<name>.py
checkpoint_path: /path/to/checkpoints/<ModelName>-<Variant>
trtllm_repo_path: /path/to/TensorRT-LLM

target:
  family: deepseek_v3
  checkpoint: r1_0528_nvfp4
  gpu_arch: sm_103
  parallel: dep4

accuracy_anchor:
  benchmark: mmlu
  score: 95.07
  tolerance: 5.0
  source: "tests/integration/defs/accuracy/references/<reference>.yaml @ <commit>"

completion_criteria:
  - "ModelingV2 required routing selects the exact target without fallback"
  - "The configured accuracy result is within tolerance of the cited anchor"

implements_tips:
  - "Built-in TensorRT-LLM model definitions may be read as implementation references"
